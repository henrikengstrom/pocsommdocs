<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get PocSomm</title>
    <!-- Utility redirect page: not for search engines -->
    <meta name="robots" content="noindex">
    <style>
        :root {
            --burgundy: #730D26;
            --burgundy-light: #8F1A33;
            --gold: #C5A059;
            --cream: #F7EBDC;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--cream);
            color: #2C2C2C;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            padding: 32px 24px;
            line-height: 1.6;
        }
        .logo {
            width: 96px; height: 96px; border-radius: 22px;
            box-shadow: 0 8px 32px rgba(115, 13, 38, 0.15);
            margin-bottom: 20px;
        }
        h1 { color: var(--burgundy); font-size: 1.6rem; margin-bottom: 6px; }
        p  { color: #4A4A4A; font-size: 0.98rem; max-width: 420px; }

        /* In-app browser instructions (Instagram & friends) */
        .escape {
            display: none;
            background: #fff; border-radius: 18px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.06);
            padding: 24px 22px; margin-top: 24px; max-width: 420px;
        }
        .escape .step {
            font-size: 1.05rem; color: #2C2C2C; text-align: left;
            display: flex; gap: 12px; align-items: flex-start;
        }
        .escape .step + .step { margin-top: 14px; }
        .escape .n {
            flex: 0 0 auto;
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--burgundy); color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 700;
        }
        .escape strong { color: var(--burgundy-light); }

        /* Arrow pointing at Instagram's ••• menu, top right */
        .corner-arrow {
            display: none;
            position: fixed; top: 10px; right: 18px;
            color: var(--burgundy-light);
            font-weight: 700; font-size: 0.9rem;
            animation: nudge 1.2s ease-in-out infinite;
        }
        .corner-arrow .up { font-size: 1.5rem; display: block; line-height: 1; }
        @keyframes nudge {
            0%, 100% { transform: translateY(6px); }
            50% { transform: translateY(0); }
        }

        .badge { display: inline-block; margin-top: 24px; }
        .badge img { height: 58px; display: block; }

        .inapp .escape { display: block; }
        .inapp .corner-arrow { display: block; }
    </style>
</head>
<body>
    <div class="corner-arrow"><span class="up">&#8598;</span>up here</div>

    <img src="../logo.png" alt="PocSomm" class="logo">
    <h1 id="headline">Get PocSomm</h1>
    <p id="status">Tap the badge to open PocSomm on the App&nbsp;Store.</p>

    <div class="escape">
        <div class="step">
            <span class="n">1</span>
            <span>Tap the <strong>&bull;&bull;&bull;</strong> menu in the top-right corner and choose <strong>Open in external browser</strong>.</span>
        </div>
        <div class="step">
            <span class="n">2</span>
            <span>That&rsquo;s it &mdash; the App&nbsp;Store opens by itself.</span>
        </div>
    </div>

    <a id="storeLink" class="badge" href="https://apps.apple.com/app/id6760143052">
        <img src="../app-store-badge.svg" alt="Download on the App Store">
    </a>

    <script>
    (function () {
        var APP_STORE_WEB = "https://apps.apple.com/app/id6760143052";
        // Handed to the OS App Store app. Instagram's in-app browser blocks it
        // (along with every other escape hatch — verified extensively), which
        // is why in-app mode leads with the "open in external browser" steps:
        // once the user lands in Safari, this page auto-redirects and the
        // App Store opens with no further taps.
        var APP_STORE_SCHEME = "itms-apps://apps.apple.com/app/id6760143052";

        var ua = navigator.userAgent || "";
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        var isInApp = /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Snapchat|Line\//i.test(ua);

        var headline = document.getElementById("headline");
        var status = document.getElementById("status");
        var storeLink = document.getElementById("storeLink");

        if (isIOS) {
            // A tapped link at least has a chance if Meta ever relents.
            storeLink.href = APP_STORE_SCHEME;

            if (isInApp) {
                document.body.className = "inapp";
                headline.textContent = "One step to the App Store";
                status.textContent = "Instagram's built-in browser can't open the App Store, so:";
            } else {
                // Real browser: auto-redirect works, badge stays as backup.
                headline.textContent = "Opening the App Store…";
                status.textContent = "Taking you to PocSomm on the App Store.";
                window.location.href = APP_STORE_SCHEME;
                setTimeout(function () {
                    if (document.visibilityState === "visible") {
                        headline.textContent = "Get PocSomm";
                        status.textContent = "Tap the badge to open PocSomm on the App Store.";
                        window.location.href = APP_STORE_WEB;
                    }
                }, 1600);
            }
        } else if (isAndroid) {
            // No Android app yet — explain rather than dead-end.
            status.textContent = "PocSomm is currently iPhone-only — an Android version is on its way. The badge below shows the iOS App Store listing.";
        } else {
            // Desktop: just go to the App Store page.
            window.location.href = APP_STORE_WEB;
        }
    })();
    </script>
</body>
</html>
